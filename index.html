<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>广安天气</title>
<style>
  :root{
    --bg:#f2f4f8; --card:#ffffff; --ink:#1a1a1a; --sub:#8a8f99;
    --line:#e8ebf0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5;padding:16px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:12px;
        box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .hero{text-align:center;padding:26px 20px 22px;
        background:linear-gradient(160deg,#ffffff 0%,#f7f9fc 100%)}
  .city{font-size:17px;font-weight:600;letter-spacing:.5px}
  .date{font-size:13px;color:var(--sub);margin-top:2px}
  .temp{font-size:64px;font-weight:200;line-height:1.05;margin:8px 0 2px;
        font-variant-numeric:tabular-nums}
  .temp span{font-size:30px;font-weight:300;vertical-align:top;margin-left:2px}
  .desc{font-size:15px;color:#3d4450}
  .range{font-size:13px;color:var(--sub);margin-top:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
        border-radius:16px;overflow:hidden;margin-bottom:12px;
        box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .cell{background:var(--card);padding:14px 16px}
  .cell .k{font-size:12px;color:var(--sub)}
  .cell .v{font-size:17px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
  .label{font-size:13px;color:var(--sub);margin-bottom:6px}
  .advice{font-size:16px;font-weight:500;line-height:1.6}
  .days{display:flex;gap:10px}
  .day{flex:1;background:var(--card);border-radius:14px;padding:14px 10px;text-align:center;
       box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .day .d{font-size:12px;color:var(--sub)}
  .day .t{font-size:14px;font-weight:500;margin:6px 0 2px;min-height:42px}
  .day .r{font-size:13px;color:#3d4450;font-variant-numeric:tabular-nums}
  .foot{text-align:center;font-size:12px;color:#a8adb8;margin-top:6px}
  .foot a{color:#a8adb8;text-decoration:none;border-bottom:1px dotted #ccd1da}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
       font-size:12px;color:var(--sub)}
  .btn{border:1px solid var(--line);background:#fff;color:var(--sub);
       border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer}
  .btn:active{background:#f5f7fa}
  .skeleton{color:#c3c8d1}
  #err{display:none;background:#fff5f5;border:1px solid #ffd9d9;color:#c0392b;
       border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <span id="updated">加载中…</span>
    <button class="btn" onclick="location.reload()">刷新</button>
  </div>

  <div id="err"></div>

  <div class="card hero">
    <div class="city" id="city">—</div>
    <div class="date" id="date"></div>
    <div class="temp"><span id="temp" style="font-size:inherit;font-weight:inherit">--</span><span>°</span></div>
    <div class="desc" id="desc"></div>
    <div class="range" id="range"></div>
  </div>

  <div class="grid">
    <div class="cell"><div class="k">体感温度</div><div class="v" id="feels">--</div></div>
    <div class="cell"><div class="k">相对湿度</div><div class="v" id="humidity">--</div></div>
    <div class="cell"><div class="k">风向风力</div><div class="v" id="wind">--</div></div>
    <div class="cell"><div class="k">紫外线</div><div class="v" id="uv">--</div></div>
  </div>

  <div class="card">
    <div class="label">👕 穿衣建议</div>
    <div class="advice" id="advice">--</div>
  </div>

  <div class="days" id="days"></div>

  <div class="foot" id="foot">数据来源：和风天气 · 中国天气网</div>

</div>

<script>
(function () {
  var API = "https://1509069815-hs7u52r5x8.ap-shanghai.tencentscf.com";           // 部署时替换成 SCF 函数 URL
  var WEEK = "日一二三四五六";

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function uvWord(v) {
    var n = parseInt(v, 10);
    if (isNaN(n)) return "--";
    if (n <= 2) return n + " 弱";
    if (n <= 5) return n + " 中";
    if (n <= 7) return n + " 强";
    return n + " 很强";
  }

  function fail(msg) {
    var box = document.getElementById("err");
    box.style.display = "block";
    box.textContent = msg;
    setText("updated", "数据加载失败");
  }

  function render(d) {
    var now = d.now || {};
    var daily = d.daily || [];
    var today = daily[0] || {};
    var dt = new Date();

    setText("city", d.city || "");
    setText("date", (dt.getMonth() + 1) + "月" + dt.getDate() + "日 周" + WEEK[dt.getDay()]);
    setText("temp", now.temp != null ? now.temp : "--");
    setText("desc", (today.textDay || now.text || "") +
      (today.textNight && today.textNight !== today.textDay ? "转" + today.textNight : ""));
    setText("range", "今日 " + (today.tempMin || "-") + "~" + (today.tempMax || "-") + " 度");
    setText("feels", (now.feelsLike != null ? now.feelsLike : "--") + "°");
    setText("humidity", (now.humidity != null ? now.humidity : "--") + "%");
    setText("wind", (now.windDir || "") + (now.windScale || "") + "级");
    setText("uv", uvWord(today.uvIndex));
    setText("advice", d.advice || "--");
    setText("updated", "更新于 " + (d.updated || "--"));

    var box = document.getElementById("days");
    box.innerHTML = "";
    for (var i = 1; i < daily.length && i <= 2; i++) {
      var day = daily[i];
      var dd = new Date(dt.getTime() + i * 86400000);
      var node = document.createElement("div");
      node.className = "day";
      node.innerHTML =
        '<div class="d">周' + WEEK[dd.getDay()] + "</div>" +
        '<div class="t">' + (day.textDay || "") + "</div>" +
        '<div class="r">' + (day.tempMin || "") + "~" + (day.tempMax || "") + "°</div>";
      box.appendChild(node);
    }

    var foot = document.getElementById("foot");
    if (d.location_id) {
      foot.innerHTML = '数据来源：和风天气 · <a href="https://www.weather.com.cn/weather/' +
        d.location_id + '.shtml">中国天气网</a>';
    }
  }

  fetch(API + "/api/weather", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      fail("拿不到天气数据（" + e.message + "），点右上角重试");
    });
})();
</script>
</body>
</html>
